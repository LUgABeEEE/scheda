name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The suite itself is offline; the only thing it needs from the network is
      # this project's one dependency, which has none of its own.
      - name: Install the package and its one dependency
        run: python -m pip install --quiet -e .

      - name: Run the test-suite
        run: python -m unittest discover -s tests -t . -v

      - name: Check the console script runs
        run: |
          scheda --version
          scheda --help > /dev/null
          python -c "import scheda, sys; print('import ok, version', scheda.__version__)"

  windows:
    name: platform checks (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Windows is a supported target (a UNC share is why generated names are
      # lowercased), and the file-system layer is where it used to diverge:
      # mount semantics were read from /proc/mounts on every platform.  This job
      # starts with the modules that contain the platform branches; widening it
      # to the full suite is the next step, not a promise made in prose.
      - name: Install the package and its one dependency
        run: python -m pip install --quiet -e .

      - name: Platform, CLI and source tests
        run: |
          python -m unittest tests.test_platform_fs tests.test_sources tests.test_cli -v

  interop:
    name: MCP interop (official SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The server is hand-rolled on the standard library.  That is only a
      # defensible choice if the real client agrees with it, so CI proves it
      # against the official SDK instead of taking it on faith.
      - name: Install the official MCP SDK and this project's dependency
        run: |
          python -m pip install --quiet mcp
          python -m pip install --quiet handrolled

      - name: Handshake, list tools and call a tool through the SDK
        run: python -m unittest tests.test_mcp.TestOfficialSdkInterop -v

  # The semantic arm is optional, which is exactly why it needs its own job:
  # on the matrix above it *skips*, so without this nothing would ever prove
  # that it works, nor that it stays off when unconfigured.
  optional:
    name: optional arm (numpy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Run this first, on a runner with no numpy at all: it asserts that
      # `import scheda` pulls in no heavy third-party module and that every
      # optional layer reports itself absent when nothing is configured.
      # The dependency, and nothing optional: this job proves the optional
      # layers stay off unless told otherwise.
      - name: Install the dependency only
        run: python -m pip install --quiet handrolled

      - name: Unconfigured means off (no optional layer switches itself on)
        run: python -m unittest tests.test_optional_off -v

      # Now install the one dependency the vector arm needs, and prove two
      # things: its own tests run (they skip on the matrix), and a full suite
      # with numpy present still passes — nothing may switch itself on because
      # a package happens to exist.
      - name: Install numpy and run the vector arm's tests
        run: |
          python -m pip install --quiet numpy
          python -m unittest tests.test_ragvec -v

      - name: The whole suite again, with numpy installed
        run: python -m unittest discover -s tests -t . -v

  packaging:
    name: wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --quiet --upgrade build twine
          python -m build
          python -m twine check dist/*

      # What gets published is what gets tested here: exactly one dependency
      # (handrolled, stdlib-only), the console script present, and a real install
      # into a venv that is not the checkout.
      - name: Exactly one dependency, and it installs and runs
        run: |
          set -eu
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/scheda --version
          /tmp/verify/bin/scheda --help > /dev/null
          /tmp/verify/bin/python - <<'PY'
          import sys
          import scheda
          assert not [m for m in ("numpy", "onnxruntime", "tokenizers") if m in sys.modules]
          print("import ok", scheda.__version__)
          PY
          python - <<'PY'
          import email.parser, pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as z:
              meta = next(n for n in z.namelist() if n.endswith("METADATA"))
              parsed = email.parser.Parser().parsestr(z.read(meta).decode())
          deps = parsed.get_all("Requires-Dist") or []
          # Exactly one, and it is handrolled.  Not pinned to a version here: the
          # point of the check is the shape, not the current number.
          assert len(deps) == 1, f"expected exactly 1 dependency, got {deps}"
          assert deps[0].split(">")[0].split("=")[0].strip() == "handrolled", deps
          print("exactly one dependency:", deps[0])
          PY

  license-headers:
    name: license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The project is dual-licensed (AGPL-3.0-or-later + commercial). Corporate
      # SBOM tooling reads the SPDX identifier, not the LICENSE file, so a source
      # file without one looks unlicensed to the people who audit dependencies.
      - name: Every source file carries its SPDX identifier
        run: |
          set -eu
          fail=0
          for f in src/scheda/*.py; do
            if ! head -2 "$f" | grep -qx '# SPDX-License-Identifier: AGPL-3.0-or-later'; then
              echo "::error file=$f::missing SPDX-License-Identifier header"
              fail=1
            fi
          done
          exit "$fail"

  hygiene:
    name: privacy and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credentials, no personal paths, no build artifacts
        run: |
          set -eu
          fail=0

          # Credential-shaped values (assignments with what looks like a real value).
          if git grep -nIE '(password|passwd|secret|api[_-]?key|access[_-]?key|private[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'"']?[^[:space:]"'"'"'`,;)]{8,}' \
               -- . ':!*.lock' | grep -vE 'os\.environ|self\.password|password[[:space:]]*=[[:space:]]*(password|value)|password=yourpassword|SCHEDA_[A-Z_]*PASSWORD'; then
            echo "::error::credential-shaped assignment found"; fail=1
          fi

          # Private network addresses and machine-specific layouts.
          if git grep -nIE '(^|[^0-9])(10|172\.(1[6-9]|2[0-9]|3[01])|192\.168)\.[0-9]{1,3}\.[0-9]{1,3}' -- .; then
            echo "::error::private IP address found"; fail=1
          fi

          # Absolute paths that only exist on the maintainer's machine.
          if git grep -nIE '(/data/agent/|/home/[a-z0-9_-]+/(kb|dsh)|[A-Z]:\\Users\\[A-Za-z0-9_-]+)' -- . ':!*.lock' ':!.github/workflows/ci.yml'; then
            echo "::error::machine-specific path found"; fail=1
          fi

          # Committed build artifacts.
          if git ls-files | grep -E '(__pycache__|\.pyc$|\.sqlite|\.egg-info|^dist/|^build/)'; then
            echo "::error::build artifact is tracked"; fail=1
          fi

          # Project metadata must point at *this* repository.  A placeholder owner
          # survives review easily because nobody clicks a link in a diff, and it
          # ships broken URLs in the package metadata.  Found the honest way: five
          # published URLs pointed at an account that does not exist.
          if [ -n "${GITHUB_REPOSITORY:-}" ]; then
            urls=$(python3 -c "import tomllib;print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['urls'].values()))")
            if ! printf '%s\n' "$urls" | grep -q "github.com/${GITHUB_REPOSITORY}"; then
              echo "::error::pyproject.toml URLs do not reference ${GITHUB_REPOSITORY}"
              printf '  %s\n' "$urls"
              fail=1
            fi
          fi

          exit $fail
