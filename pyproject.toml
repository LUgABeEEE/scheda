[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scheda"
description = "A personal Markdown knowledge base with a local mirror and index, built to be queried cheaply by AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "scheda contributors" }]
keywords = ["knowledge-base", "markdown", "full-text-search", "sqlite-fts5", "ai-agents", "local-first", "webdav"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Utilities",
]
# One dependency, and it has none: `handrolled` is the stdlib-only toolkit this
# project's text/WebDAV/mount/import layers were extracted into.  The whole tree
# stays pure Python with no compiled extensions.
dependencies = ["handrolled>=0.1.1"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/LUgABeEEE/scheda"
Documentation = "https://github.com/LUgABeEEE/scheda#readme"
Source = "https://github.com/LUgABeEEE/scheda"
Issues = "https://github.com/LUgABeEEE/scheda/issues"
Changelog = "https://github.com/LUgABeEEE/scheda/blob/main/CHANGELOG.md"

[project.scripts]
scheda = "scheda.cli:main"
# 0.9.0 renamed the project. The old command keeps working from the same
# package, so a systemd timer or a script calling `dsh-kb refresh` does not
# break on upgrade; the separate `dsh-kb` distribution becomes a shim.
dsh-kb = "scheda.cli:main"

[tool.setuptools.dynamic]
# Single source of truth: the version lives in `scheda.__version__` only.
version = { attr = "scheda.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scheda = ["py.typed"]
